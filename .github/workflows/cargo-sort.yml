name: Cargo sort

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-sort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-sort:
    name: cargo sort
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the repository's Rust toolchain
        run: rustup show active-toolchain

      - name: Install cargo-sort from crates.io
        run: |
          # Pin the extension version independently of the Rust compiler.
          cargo install --locked --version 1.0.9 \
            --root "$RUNNER_TEMP/cargo-sort" cargo-sort
          echo "$RUNNER_TEMP/cargo-sort/bin" >> "$GITHUB_PATH"

      - name: Check Cargo manifests
        run: |
          git ls-files -z -- Cargo.toml '**/Cargo.toml' ':(exclude)external/**' |
            while IFS= read -r -d '' manifest; do
              cargo sort --check --check-format "$(dirname "$manifest")"
            done
