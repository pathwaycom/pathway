name: Typos

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: typos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          files: .
          isolated: true
          config: ./_typos.toml
          write_changes: false
