[pytest]
# A service-free subset for PR feedback. The package workflows run the full suite.
testpaths =
    python/pathway/tests/test_argtuple.py
    python/pathway/tests/test_colnamespace.py
    python/pathway/tests/test_column_paths.py
    python/pathway/tests/test_column_properties.py
    python/pathway/tests/test_dtypes.py
    python/pathway/tests/test_expression_repr.py
    python/pathway/tests/test_joins.py
    python/pathway/tests/test_json.py
    python/pathway/tests/test_operators.py
    python/pathway/tests/test_reducers.py
    python/pathway/tests/test_schema.py
    python/pathway/tests/test_sql.py
    python/pathway/tests/test_types.py
addopts = -ra --strict-config
timeout = 120
